version: 2

# One coordinated version-update PR, validated across the whole platform.
# Security alerts remain enabled independently of this weekly batch.
multi-ecosystem-groups:
  platform-dependencies:
    schedule:
      interval: weekly
      day: tuesday
    labels:
      - dependencies

updates:
  # uv updates pyproject.toml and uv.lock together.
  - package-ecosystem: uv
    directories:
      - "/"
      - "/forge/features/auth/templates/platform_auth_gatekeeper/all/files/deploy/infra/gatekeeper"
      - "/forge/features/auth/templates/platform_auth_sdk/python/files/packages/platform-auth"
    patterns: ["*"]
    multi-ecosystem-group: platform-dependencies

  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: platform-dependencies

  - package-ecosystem: npm
    directories:
      - "/"
      - "/forge/features/auth/templates/platform_auth_sdk_node/node/files/packages/platform-auth-node"
    patterns: ["*"]
    multi-ecosystem-group: platform-dependencies
    ignore:
      # Vue/Svelte remain on TS 6's JavaScript API; canvas-core uses TS 7.
      # Keep major bumps coordinated until the framework migration in #357.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/forge/features/auth/templates/platform_auth_sdk_rust/rust/files/packages/platform-auth-rs"
    patterns: ["*"]
    multi-ecosystem-group: platform-dependencies

  - package-ecosystem: pub
    directories:
      - "/packages/forge-canvas-core-dart"
      - "/packages/forge-canvas-dart"
      - "/forge/templates/apps/flutter-frontend-template/{{project_slug}}/packages/forge_canvas_core"
      - "/forge/templates/apps/flutter-frontend-template/{{project_slug}}/packages/forge_canvas"
    patterns: ["*"]
    multi-ecosystem-group: platform-dependencies
