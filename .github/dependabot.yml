version: 2
updates:
  # Update pyproject.toml and uv.lock together; pip leaves the lock stale.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "mutmut"
          - "coverage"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels:
      - ci

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      ag-ui:
        patterns:
          - "@ag-ui/*"

  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 10
    labels:
      - dependencies

  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 10
    labels:
      - dependencies
