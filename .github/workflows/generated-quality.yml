name: Generated quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: generated-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: '3.13'
      - run: uv sync --locked --dev
      - name: New attribution policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ]; then
            uv run --locked python scripts/check_attribution.py "$BASE_SHA..HEAD"
          else
            uv run --locked python scripts/check_attribution.py "HEAD^..HEAD"
          fi
      - name: Gate acceptance tests and coverage
        run: >-
          uv run --locked pytest tests/test_generated_quality.py tests/test_quality_execution.py
          tests/test_attribution_policy.py --cov-reset --cov=forge.quality
          --cov=forge.recommend --cov=forge.cli.commands.quality --cov-fail-under=80.01
          --cov-report=xml
  rendered:
    strategy:
      fail-fast: false
      matrix:
        language: [python, node, rust, vue, svelte]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge-test
          POSTGRES_DB: forge_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://forge:forge-test@localhost:5432/forge_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          python-version: '3.13'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        if: matrix.language == 'rust'
        with:
          components: llvm-tools-preview
      - if: matrix.language == 'rust'
        run: cargo install cargo-llvm-cov --locked --version 0.6.21
      - run: uv sync --locked --dev
      - name: Rendered application and shared-runtime gates
        run: uv run --locked python scripts/check_generated_quality.py --language ${{ matrix.language }} --output .artifacts/generated-${{ matrix.language }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: generated-${{ matrix.language }}-coverage
          path: .artifacts/generated-*/.forge/coverage/
          include-hidden-files: true
          if-no-files-found: error
  generated-quality:
    needs: [policy, rendered]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          RENDERED_RESULT: ${{ needs.rendered.result }}
        run: test "$POLICY_RESULT" = success && test "$RENDERED_RESULT" = success
