[feature]
name = "Console"
version = "0.1.0"
summary = "Console app template — left-nav + dashboard with KPI cards (Layer-3)."
category = "template"
stability = "experimental"
layer = 3

[feature.component]
# Its own files are kit-free; a kit is still refused through any child
# that lacks it (StatCard today).
ui_kits = ["shadcn", "nuxt-ui"]

[feature.component.children]
StatCard = "*"
