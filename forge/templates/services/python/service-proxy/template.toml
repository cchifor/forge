# Preferred name for the optional forwarding/S2S-token template. Reuse the
# existing overlay so api-gateway remains a compatible configuration name;
# emitted Python module names and /gateway routes are unchanged.
[template]
variant = "service-proxy"
language = "python"
template_dir = "services/python/api-gateway"
base = "services/python-service-template"
display_label = "Python — service proxy (opt-in)"
supported = true
