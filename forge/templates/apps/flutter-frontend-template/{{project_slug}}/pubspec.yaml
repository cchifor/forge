name: {{project_slug}}
description: "{{description}}"
publish_to: none
version: {{version}}+1

environment:
  # Current code generators and the native Riverpod analyzer plugin require
  # Dart 3.13 / Flutter 3.47. Keep CI and local toolchains aligned.
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  material_ui: ^1.6.0
  flutter:
    sdk: flutter

  # UI / Theme
  cupertino_icons: ^2.0.0
  flex_color_scheme: ^9.0.0
  google_fonts: ^9.0.0

  # State Management
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.4.3

  # Networking
  dio: ^5.11.1
{%- if include_openapi %}
  retrofit: ^4.10.0
{%- endif %}

{%- if include_chat %}

  # AG-UI chat — forge_canvas ships the production SSE client
  # (exponential-backoff reconnect + Last-Event-ID resume) + canvas
  # registry + shadcn-flavored theme. Vendored into this project under
  # packages/forge_canvas/ (not pinned to a published pub.dev package),
  # so the project is self-contained and you own the code. It resolves
  # forge_canvas_core from packages/forge_canvas_core/ in turn.
  forge_canvas:
    path: packages/forge_canvas

  # Chat-specific extras still needed alongside forge_canvas:
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  json_patch: ^3.0.0
  shimmer: ^4.0.0
  # file_selector: Flutter team's official cross-platform file
  # picker. Used by ChatInputBar for the paperclip attach button
  # (Pillar G.1). Smaller than `file_picker`; covers the case we
  # need (pick one or more files, get bytes back).
  file_selector: ^1.1.0
{%- endif %}

  # Routing
  go_router: ^18.0.2

  # Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

{%- if include_auth %}

  # Auth
  flutter_appauth: ^12.1.0
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  http: ^1.6.0
{%- endif %}

  # Storage
  shared_preferences: ^2.5.6

  # Utilities
  collection: ^1.19.1
  intl: ^0.20.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.16.2
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9
  go_router_builder: ^4.5.0
{%- if include_openapi %}
  retrofit_generator: ^10.2.11
{%- endif %}

  # Linting
  flutter_lints: ^6.0.0

{%- if include_openapi %}

  # OpenAPI Code Generation
  swagger_parser: ^1.45.0
{%- endif %}

  # Testing
  mocktail: ^1.0.5
  # import_lint: ^0.1.6  # Add if needed for import analysis

flutter:
  uses-material-design: true
