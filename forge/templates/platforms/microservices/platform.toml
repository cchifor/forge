# Platform preset — discovered by forge.platform_templates.
#
# Domain services receive requests directly from the edge. Orders declares
# inventory as a downstream to demonstrate S2S grants without an intermediary.
[platform]
name = "microservices"
display_label = "Microservices platform"
description = "Directly routed orders and inventory services, with S2S auth and an event bus."
include_keycloak = true

[platform.options]
"auth.service_discovery" = true
"infrastructure.event_bus" = "postgres_notify"

[[platform.backends]]
name = "orders"
language = "python"
app_template = "crud-service"
server_port = 5020
depends_on = ["inventory"]

[[platform.backends]]
name = "inventory"
language = "python"
app_template = "crud-service"
server_port = 5030

[platform.frontend]
framework = "vue"
layout = "sidebar"
