# Platform preset — discovered by forge.platform_templates.
#
# A single orders API behind edge authentication, with no intermediary,
# event bus, or frontend. S2S discovery is unnecessary with one backend.
[platform]
name = "headless-api"
display_label = "Headless API platform"
description = "A directly routed orders API with edge authentication, no frontend."
include_keycloak = true

[platform.options]
"auth.service_discovery" = false

[[platform.backends]]
name = "orders"
language = "python"
app_template = "crud-service"
server_port = 5020
