name: CI (node service)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: __FORGE_SERVICE_MATRIX__
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.runtime }}
      - name: Install locked workspace
        working-directory: .
        run: npm ci
      - name: Generate database client
        run: npm run generate --if-present
      - name: Lint, build and unit tests
        run: |
          npm run lint
          npm run build
          npm test
      - name: Audit runtime dependencies
        working-directory: .
        run: npm audit --omit=dev --audit-level=high
