name: CI (node service)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: __FORGE_SERVICE_MATRIX__
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.runtime }}
      - name: Install locked workspace
        working-directory: .
        run: npm ci
      - name: Generate database client
        run: npm run generate --if-present
      - name: Lint, build and unit tests
        run: |
          npm run lint
          npm run build
          npm test
      - name: Audit runtime dependencies
        working-directory: .
        run: npm audit --omit=dev --audit-level=high
